<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>ModuleAgent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 设置界面 -->
    <div id="setup-screen" class="setup-screen">
      <div class="setup-card">
        <div class="setup-logo">ModuleAgent</div>
        <p class="setup-subtitle">配置工作目录、模块目录和 Agent 命令后开始</p>

        <div class="setup-field">
          <label>Agent 命令</label>
          <p class="field-hint">启动 Agent 的可执行文件名或路径</p>
          <div class="input-row">
            <input id="agent-cmd-input" placeholder="opencode" value="opencode">
          </div>
        </div>

        <div class="setup-field">
          <label>Agent 参数</label>
          <p class="field-hint">传给 Agent 的额外参数（空格分隔，如: acp）</p>
          <div class="input-row">
            <input id="agent-args-input" placeholder="acp" value="acp">
          </div>
        </div>

        <div class="setup-field">
          <label>工作目录</label>
          <p class="field-hint">Agent 的工作空间，模块代码将同步到此目录</p>
          <div class="input-row">
            <input id="workspace-input" readonly placeholder="点击右侧按钮选择...">
            <button id="btn-workspace" class="btn">浏览</button>
          </div>
        </div>

        <div class="setup-field">
          <label>模块目录</label>
          <p class="field-hint">包含 module.md 的项目根目录</p>
          <div class="input-row">
            <input id="project-input" readonly placeholder="点击右侧按钮选择...">
            <button id="btn-project" class="btn">浏览</button>
          </div>
        </div>

        <button id="btn-start" class="btn-primary setup-start" disabled>开始扫描</button>
        <p id="setup-error" class="setup-error" style="display:none;"></p>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-screen" class="main-screen" style="display:none;">
      <!-- 悬浮按钮 -->
      <button id="btn-back" class="fab fab-back" title="返回">←</button>
      <button id="btn-settings" class="fab fab-settings" title="设置">⚙</button>

      <div id="tree-panel" class="tree-panel">
        <svg id="tree-svg"></svg>
      </div>
      <div class="status-bar">
        <span class="dot"></span>
        <span id="status-text">就绪</span>
        <span id="status-info"></span>
        <span class="spacer"></span>
        <span id="status-path"></span>
      </div>
    </div>

    <!-- 抽屉遮罩 -->
    <div id="drawer-overlay" class="drawer-overlay" style="display:none;"></div>

    <!-- 右侧抽屉 -->
    <div id="drawer" class="drawer">
      <div class="drawer-header">
        <span id="drawer-title"></span>
        <button id="drawer-close" class="btn-close">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </div>

    <!-- 模态窗 -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="modal-header">
          <span id="modal-title"></span>
          <button id="modal-close" class="btn-close">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
