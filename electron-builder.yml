appId: com.moduleagent.app
productName: ModuleAgent
directories:
  output: release
files:
  - 'out/**/*'
  - 'dist/**/*'
  - 'src/**/*'
  - 'config/**/*'
  - 'node_modules/**/*'
  - 'package.json'
  - '!**/.vscode/*'
  - '!electron.vite.config.*'
win:
  target: portable
  icon: null
linux:
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
