[package]
name = "module-agent-backend"
version = "0.1.0"
description = "Module Agent orchestration backend — Rust sidecar replacing Node.js server"
authors = ["belowthetree"]
edition = "2021"

[[bin]]
name = "module-agent-backend"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.12"
agent-client-protocol-rmcp = "0.11"
rmcp = { version = "1", features = ["server", "macros", "schemars"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
futures = "0.3"
pathdiff = "0.2"

[profile.release]
opt-level = 2
lto = true