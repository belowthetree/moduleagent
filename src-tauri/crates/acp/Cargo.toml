[package]
name = "acp"
version = "0.1.0"
edition = "2021"
description = "Agent Client Protocol (ACP) implementation — JSON-RPC 2.0 over NDJSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "fs", "rt"] }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
