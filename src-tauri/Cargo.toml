[workspace]
members = [".", "crates/acp", "crates/backend"]

[package]
name = "module-agent"
version = "0.4.0"
description = "Module Agent orchestration framework"
authors = ["belowthetree"]
edition = "2021"

[lib]
name = "module_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
acp = { path = "crates/acp" }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "fs", "rt"] }
