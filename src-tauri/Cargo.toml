[package]
name = "module-agent"
version = "0.4.0"
description = "Module Agent orchestration framework"
authors = ["belowthetree"]
edition = "2021"

[lib]
name = "module_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
agent-client-protocol = "0.12"
agent-client-protocol-rmcp = "0.11"
rmcp = { version = "1", features = ["server", "macros", "schemars"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
log = "0.4"
log4rs = { version = "1", features = ["rolling_file_appender", "compound_policy", "size_trigger", "fixed_window_roller"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
futures = "0.3"
async-trait = "0.1"
pathdiff = "0.2"
